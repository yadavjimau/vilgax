<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VILGAX</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    body.entered { cursor: default; }

    .bg-video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.1);
        filter: blur(8px) brightness(1.1);
        z-index: -3;
        pointer-events: none;
    }

    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.55);
        z-index: -2;
        pointer-events: none;
    }

    .stage {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4rem;
        z-index: 1;
    }

    h1 {
        font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
        font-size: clamp(3rem, 15vw, 18rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        color: #000000;
        user-select: none;
        text-align: center;
        line-height: 1;
        text-shadow:
            0 0 6px rgba(0, 0, 0, 0.55),
            0 0 16px rgba(0, 0, 0, 0.35),
            0 0 32px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transition: opacity 0.8s ease;
    }

    body.entered h1 { opacity: 1; }

    .enter-hint {
        font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
        font-size: clamp(1rem, 2.5vw, 1.4rem);
        font-weight: 900;
        letter-spacing: 0.4em;
        color: #000;
        text-align: center;
        user-select: none;
        padding-left: 0.4em;
        text-shadow:
            0 0 6px rgba(0, 0, 0, 0.4),
            0 0 14px rgba(0, 0, 0, 0.2);
        animation: hintPulse 2.5s ease-in-out infinite;
    }

    @keyframes hintPulse {
        0%, 100% { opacity: 0.4; }
        50%      { opacity: 1; }
    }

    body.entered .enter-hint {
        display: none;
    }
</style>
</head>
<body>

    <video
        id="bg"
        class="bg-video"
        src="bg.mp4"
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
    ></video>

    <div class="overlay"></div>

    <div class="stage">

        <h1>𝐕𝐈𝐋𝐆𝐀𝐗</h1>
        <div class="enter-hint">CLICK TO ENTER</div>

    </div>

    <script>
        (function () {
            var v = document.getElementById('bg');
            var entered = false;

            function enter() {
                if (entered) return;
                entered = true;

                v.muted = true;
                v.volume = 0;
                var p = v.play();
                if (p && p.catch) {
                    p.catch(function (e) { console.log('play failed:', e); });
                }

                document.body.classList.add('entered');
            }

            document.addEventListener('click', enter);
            document.addEventListener('touchend', enter, { passive: true });
            document.addEventListener('keydown', function (e) {
                if (e.key === ' ' || e.key === 'Enter') enter();
            });
        })();
    </script>

</body>
</html>
