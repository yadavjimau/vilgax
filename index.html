<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VILGAX</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        overflow: hidden;
        background: #000;
    }
    .bg-video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.08);
        filter: blur(12px) brightness(0.55);
        z-index: -2;
        pointer-events: none;
    }
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: -1;
        pointer-events: none;
    }
    .stage {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    h1 {
        font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
        font-size: clamp(2rem, 10vw, 10rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        color: #ffffff;
        user-select: none;
        text-align: center;
        line-height: 1;
        text-shadow:
            0 0 10px rgba(0, 0, 0, 0.7),
            0 0 30px rgba(0, 0, 0, 0.5),
            0 0 60px rgba(0, 0, 0, 0.3);
    }
</style>
</head>
<body>

    <video
        id="bg"
        class="bg-video"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        x5-playsinline
    >
        <source src="bg.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="stage">
        <h1>𝐕𝐈𝐋𝐆𝐀𝐗</h1>
    </div>

    <script>
        (function () {
            var v = document.getElementById('bg');
            if (!v) return;

            // force every attribute that matters
            v.muted = true;
            v.defaultMuted = true;
            v.volume = 0;
            v.setAttribute('muted', '');
            v.setAttribute('playsinline', '');
            v.setAttribute('webkit-playsinline', '');
            v.autoplay = true;
            v.loop = true;

            function kick() {
                // skip black intro frames if any
                try {
                    if (v.currentTime < 0.5) v.currentTime = 1.0;
                } catch (e) {}

                var p = v.play();
                if (p && p.catch) {
                    p.catch(function (err) {
                        console.log('[bg] play blocked:', err && err.name);
                    });
                }
            }

            if (v.readyState >= 2) {
                kick();
            } else {
                v.addEventListener('loadeddata', kick, { once: true });
                v.addEventListener('canplay', kick, { once: true });
            }

            // last resort — any user touch on page starts the video
            var unlock = function () {
                kick();
                document.removeEventListener('touchstart', unlock);
                document.removeEventListener('click', unlock);
                document.removeEventListener('scroll', unlock);
                document.removeEventListener('touchend', unlock);
            };
            document.addEventListener('touchstart', unlock, { passive: true });
            document.addEventListener('touchend', unlock, { passive: true });
            document.addEventListener('click', unlock);
            document.addEventListener('scroll', unlock, { passive: true });
        })();
    </script>

</body>
</html>
