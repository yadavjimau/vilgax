<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VILGAX</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    /* full-screen video, blurred, behind everything */
    .bg-video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* slight scale stops blur from showing soft edges */
        transform: scale(1.08);
        filter: blur(12px) brightness(0.55);
        z-index: -2;
    }

    /* optional dark tint so text pops even more */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: -1;
    }

    .stage {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    h1 {
        font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
        font-size: clamp(2rem, 10vw, 10rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        color: #ffffff;
        user-select: none;
        text-align: center;
        line-height: 1;
        text-shadow:
            0 0 10px rgba(0, 0, 0, 0.7),
            0 0 30px rgba(0, 0, 0, 0.5),
            0 0 60px rgba(0, 0, 0, 0.3);
    }
</style>
</head>
<body>

    <video
        class="bg-video"
        src="bg.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    ></video>

    <div class="overlay"></div>

    <div class="stage">
        <h1>𝐕𝐈𝐋𝐆𝐀𝐗</h1>
    </div>

</body>
   </html>
